name: Build macOS
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching the destination Release (e.g. 3.2.0)'
        required: true
        default: '3.2.0'
      base_version:
        description: 'Signed Windows Release providing app source'
        required: true
        default: '3.2.0'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      VERSION: ${{ inputs.version }}
      BASE_VERSION: ${{ inputs.base_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare build dependencies
        run: python -m pip install cryptography pytest
      - name: Updater regression tests
        run: python -m pytest macos/tests -q
      - name: Build standalone app and packages
        run: python macos/build.py --version "$VERSION" --base-version "$BASE_VERSION" --output build
      - name: Test packaged app, generation and signed upgrade
        run: python macos/ci_test.py build
      - name: Save distributable files and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: xhs-agent-macos-${{ matrix.arch }}
          path: build/release/*
          if-no-files-found: error
      - name: Diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.arch }}
          path: |
            build/qa/**/*.log
            build/pyinstaller/**/warn-*.txt
            build/qa/Library/Application Support/*.log
